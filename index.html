<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LOST IN THE FOREST</title>
  <meta name="description" content="A DOS/EGA-era text adventure. You are lost in a 10x10 forest. Find the ranger station before thirst, cold, or the bear finds you." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8C%B2%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-mode="boot">
  <!-- desk / room the monitor sits in -->
  <div id="desk">
    <!-- the monitor bezel around the EGA-proportioned screen -->
    <div id="monitor">
      <div id="crt">
        <div id="scanlines" aria-hidden="true"></div>
        <div id="glass">
          <main id="screen">
            <header id="hud">
              <pre id="map" aria-label="forest map"></pre>
              <div id="panel">
                <pre id="stats"></pre>
                <pre id="env"></pre>
                <pre id="pack"></pre>
              </div>
            </header>

            <section id="log" aria-live="polite" tabindex="0"></section>

            <form id="prompt" autocomplete="off">
              <span class="caret">&gt;</span>
              <input id="cmd" name="cmd" type="text" autocomplete="off" autocorrect="off"
                     autocapitalize="off" spellcheck="false" aria-label="command" maxlength="60" />
            </form>
          </main>
        </div>
      </div>
      <div id="badge">LAB980<span>&nbsp;EGA</span></div>
    </div>

    <!-- on-screen controls (handy on touch; work everywhere) -->
    <div id="keypad" aria-label="quick controls">
      <button data-cmd="north" title="go north">N</button>
      <button data-cmd="south" title="go south">S</button>
      <button data-cmd="east"  title="go east">E</button>
      <button data-cmd="west"  title="go west">W</button>
      <button data-cmd="look"  class="wide">LOOK</button>
      <button data-cmd="climb" class="wide">CLIMB</button>
      <button data-cmd="take"  class="wide">TAKE</button>
      <button data-cmd="inventory" class="wide">PACK</button>
      <button data-cmd="help"  class="wide">HELP</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
