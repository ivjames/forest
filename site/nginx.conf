# lostintheforest88.com — landing page + playable demo, one static clone.
#
#   /            -> site/index.html   (landing page, self-contained)
#   /play/       -> repo root         (the game itself)
#   /shots/      -> steam/store_assets/screenshots/
#   /art/        -> steam/store_assets/
#
# Same conventions as forest.lab980.com: no-cache on HTML/CSS/JS so a
# `git pull` shows up immediately; fonts cached hard. certbot adds the
# 80->443 redirect after this is live.
server {
    listen 80;
    listen [::]:80;
    server_name lostintheforest88.com www.lostintheforest88.com;

    root /var/www/lostintheforest88;
    index index.html;

    # Shared security headers (HSTS, X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy). nginx does NOT merge add_header across contexts: any
    # location{} that sets an add_header of its own stops inheriting these, so
    # every location below that sets Cache-Control re-includes this line. Miss
    # one and that path silently serves with no security headers at all.
    include snippets/lab980-security-headers.conf;

    # Landing page at the domain root.
    location = / {
        try_files /site/index.html =404;
        include snippets/lab980-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The demo: the game files live at the repo root.
    location /play/ {
        alias /var/www/lostintheforest88/;
        index index.html;
        include snippets/lab980-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fonts under the demo are effectively immutable: cache them hard.
    location ~* ^/play/(fonts/.+\.woff2?)$ {
        alias /var/www/lostintheforest88/$1;
        include snippets/lab980-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Store art reused by the landing page and link previews.
    location /shots/ {
        alias /var/www/lostintheforest88/steam/store_assets/screenshots/;
        include snippets/lab980-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location /art/ {
        alias /var/www/lostintheforest88/steam/store_assets/;
        include snippets/lab980-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
        include snippets/lab980-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The web root is the git checkout, so repo docs and plumbing are otherwise
    # fetchable: /README.md, /DEPLOY.md, /STEAM.md, /steam/*.md — and the same
    # files a second time under the /play/ alias. A regex location outranks the
    # prefix locations above, so this one rule covers every alias as well as the
    # root. Matches the canonical static vhost in the lab980 new-site scaffold.
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.md$ { deny all; }
}
