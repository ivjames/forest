# lostintheforest88.com — landing page + playable demo, one static clone.
#
#   /            -> site/index.html   (landing page, self-contained)
#   /play/       -> repo root         (the game itself)
#   /shots/      -> steam/store_assets/screenshots/
#   /art/        -> steam/store_assets/
#
# Same conventions as forest.lab980.com: no-cache on HTML/CSS/JS so a
# `git pull` shows up immediately; fonts cached hard. certbot adds the
# 80->443 redirect after this is live.
server {
    listen 80;
    listen [::]:80;
    server_name lostintheforest88.com www.lostintheforest88.com;

    root /var/www/lostintheforest88;
    index index.html;

    # Landing page at the domain root.
    location = / {
        try_files /site/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # The demo: the game files live at the repo root.
    location /play/ {
        alias /var/www/lostintheforest88/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Fonts under the demo are effectively immutable: cache them hard.
    location ~* ^/play/(fonts/.+\.woff2?)$ {
        alias /var/www/lostintheforest88/$1;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Store art reused by the landing page and link previews.
    location /shots/ {
        alias /var/www/lostintheforest88/steam/store_assets/screenshots/;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location /art/ {
        alias /var/www/lostintheforest88/steam/store_assets/;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
